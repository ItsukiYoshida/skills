interface:
  display_name: "Goal Checkpoint Runner"
  short_description: "Run goal checkpoints through commit, PR, and review"
  default_prompt: "Use $goal-checkpoint-runner to turn this plan into a checkpointed goal. During planning, ask which CP-FINAL quality gate to use: SubAgents Review, Codex Review, or Claude Review. Add CP-PUBLISH before CP-FINAL: create debt-unit Conventional Commit commits, push the branch, create a PR, and make the PR title Conventional Commit formatted. Never merge the PR or enable auto-merge, even if explicitly authorized. Use the separate commit skills skill for commit message and PR title type/scope decisions when available. CP-FINAL must run the selected gate exactly as recorded, run required reviewers in parallel when supported, aggregate review outputs into ACCEPTED / CHANGES_REQUESTED / UNKNOWN, and complete only when the aggregated status is ACCEPTED."

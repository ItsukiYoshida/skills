interface:
  display_name: "Goal Checkpoint Runner"
  short_description: "Run goal checkpoints through commit, PR, and a selected review gate"
  default_prompt: "Use $goal-checkpoint-runner to turn this plan into a checkpointed goal. During planning, ask which CP-FINAL quality gate to use: SubAgents Review, Codex Review, or Claude Review. Add CP-PUBLISH before CP-FINAL: create debt-unit Conventional Commit commits, push the branch, create a PR, and make the PR title Conventional Commit formatted. Use the separate commit skills skill for commit message and PR title type/scope decisions when available. CP-FINAL must run the selected gate exactly as recorded, run required reviewers in parallel when supported, merge results into ACCEPTED / CHANGES_REQUESTED / UNKNOWN, and complete only when the merged status is ACCEPTED."
